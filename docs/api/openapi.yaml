    delete:
      tags: [Common Operating Picture]
      summary: Relieve an ICS role assignment
      description: 'x-permission: `command.manage` (geo-scoped to the event)'
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: roleId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Relieved IcsRole (relieved_at set) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

