      description: 'x-permission: `analytics.read`. Omitting `scope` requires an unscoped (national-level) grant.'
      parameters:
        - { in: query, name: months, schema: { type: integer, minimum: 1, maximum: 36, default: 12 } }
        - { in: query, name: scope, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'count + data: MonthlyHazardTrend[]'
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/MonthlyHazardTrend' } } } }] } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Badges ────────────────────────────────────────────────────────────────
  /badges:
    get:
      tags: [Badges]
      summary: The badge catalog (public — what's earnable and how)
      security: []
      responses:
        '200':
          description: 'count + data: Badge[]'
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/Badge' } } } }] } } }

  /badges/leaderboard:
    get:
      tags: [Badges]
      summary: Top reporters by verified-report count (public — recognition is meant to be visible)
      security: []
      parameters:
        - { in: query, name: scope, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 'count + data: LeaderboardEntry[]'
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/LeaderboardEntry' } } } }] } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /badges/me:
    get:
      tags: [Badges]
      summary: The caller's own earned badges
      responses:
        '200':
          description: 'count + data: UserBadge[]'
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/UserBadge' } } } }] } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Data Hub ──────────────────────────────────────────────────────────────
  /datahub/datasets:
    get:
      tags: [Data Hub]
      summary: Browse the dataset catalog
      description: >
        Works logged-out (optionalAuth). Visibility is enforced in-service, not by RBAC
        middleware: callers without `data.dataset.read` (including anonymous) only ever
        see `status=published AND sharing_mode=public` rows.
      security: []
      parameters:
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: sharingMode, schema: { type: string, enum: [public, by_request, private] } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: placeId, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'count + data: Dataset[]'
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/Dataset' } } } }] } } }
    post:
      tags: [Data Hub]
      summary: Create a dataset (starts as draft)
      description: 'x-permission: `data.publish` (national-scope)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, format]
              properties:
                name: { type: string, minLength: 2, maxLength: 200 }
                description: { type: string, maxLength: 4000 }
                category: { type: string, maxLength: 100 }
                placeId: { type: string, format: uuid }
                timeRangeStart: { type: string, format: date }
                timeRangeEnd: { type: string, format: date }
                format: { type: string, enum: [csv, geojson, excel, pdf, json] }
                fileUrl: { type: string, format: uri }
                fileSizeBytes: { type: integer, minimum: 0 }
                rowCount: { type: integer, minimum: 0 }
                license: { type: string, enum: [cc_by, cc_by_sa, cc0, open_data, restricted, proprietary], default: restricted }
                attribution: { type: string, maxLength: 500 }
                sharingMode: { type: string, enum: [public, by_request, private], default: private }
                containsPii: { type: boolean, default: false, description: 'Cannot be true together with sharingMode=public — 400 if so.' }
      responses:
        '201': { description: Created Dataset }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /datahub/datasets/{id}:
    get:
      tags: [Data Hub]
      summary: Dataset detail (same visibility rule as the catalog list)
      security: []
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Dataset }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Data Hub]
      summary: Update dataset metadata
      description: 'x-permission: `data.publish` (national-scope)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: All fields from POST /datasets, all optional (partial update).
      responses:
        '200': { description: Updated Dataset }
        '400': { description: 'Invalid body, or the PII/public guard rejects the effective post-patch state' }
        '404': { $ref: '#/components/responses/NotFound' }

  /datahub/datasets/{id}/download:
    get:
      tags: [Data Hub]
      summary: Download (or get the file URL for) a dataset, per its sharing mode
      description: >
        Public+published datasets need zero auth. `by_request`/`private` need either a
        Bearer JWT (with an approved request, or matching org, or `data.publish`) or a
        valid `X-API-Key`. Every successful call is logged for usage analytics.
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }, {}]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: '{ fileUrl, format } — not the full Dataset object' }
        '401': { description: Invalid or revoked API key }
        '403': { description: 'Not published, or no access — request access first' }
        '404': { description: 'Dataset not found, or has no file attached yet' }

  /datahub/datasets/{id}/submit-for-review:
    post:
      tags: [Data Hub]
      summary: Submit a draft (or rejected) dataset for QA review
      description: 'x-permission: `data.publish` (national-scope)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Dataset now pending_review }
        '400': { description: 'Not found, or not in draft/rejected state' }

  /datahub/datasets/{id}/review:
    post:
      tags: [Data Hub]
      summary: QA decision — publish or reject
      description: 'x-permission: `data.publish` (national-scope)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [published, rejected] } } } } }
      responses:
        '200': { description: Updated Dataset }
        '400': { description: 'Invalid body, or not pending_review' }

  /datahub/datasets/{id}/archive:
    post:
      tags: [Data Hub]
      summary: Archive a dataset
      description: 'x-permission: `data.publish` (national-scope)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Dataset now archived }, '404': { $ref: '#/components/responses/NotFound' } }

  /datahub/datasets/{id}/usage:
    get:
      tags: [Data Hub]
      summary: Download/request usage analytics for a dataset
      description: 'x-permission: `data.publish` (national-scope)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: DatasetUsageStats
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { $ref: '#/components/schemas/DatasetUsageStats' } } }] } } }

  /datahub/datasets/{id}/requests:
    post:
      tags: [Data Hub]
      summary: Request access to a by_request dataset
      description: 'x-permission: `data.request.create` (national-scope)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [justification], properties: { justification: { type: string, minLength: 10, maxLength: 2000 } } } } }
      responses:
        '201': { description: Created DataRequest (status pending) }
        '400': { description: 'Invalid body, dataset not published, or not by_request mode' }
    get:
      tags: [Data Hub]
      summary: List requests for a dataset (owner/admin view)
      description: 'x-permission: `data.request.approve` (national-scope)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 'count + data: DataRequest[]'
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/DataRequest' } } } }] } } }

  /datahub/my-requests:
    get:
      tags: [Data Hub]
      summary: The caller's own data requests, across all datasets
      responses:
        '200':
          description: 'count + data: DataRequest[]'
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/DataRequest' } } } }] } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /datahub/requests/{id}/review:
    post:
      tags: [Data Hub]
      summary: Approve or deny a data request
      description: 'x-permission: `data.request.approve` (national-scope)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approved, denied] }, notes: { type: string, maxLength: 1000 } } }
      responses:
        '200': { description: Updated DataRequest }
        '404': { description: 'Not found or not pending' }

  /datahub/api-keys:
    post:
      tags: [Data Hub]
      summary: Create an org-scoped Public-Data-API key
      description: 'x-permission: `data.publish` (national-scope). The raw key is returned exactly once, here.'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 2, maxLength: 200 } } } } }
      responses:
        '201':
          description: ApiKeyCreated (includes rawKey — shown once, never again)
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { $ref: '#/components/schemas/ApiKeyCreated' } } }] } } }
        '400': { description: 'Missing name, or the caller has no organization' }
    get:
      tags: [Data Hub]
      summary: List the caller's org's API keys
      description: 'x-permission: `data.publish` (national-scope)'
      responses:
        '200':
          description: 'count + data: ApiKey[] (no rawKey field on reads)'
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/ApiKey' } } } }] } } }

  /datahub/api-keys/{id}:
    delete:
      tags: [Data Hub]
      summary: Revoke an API key
      description: 'x-permission: `data.publish` (national-scope)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Revoked ApiKey }
        '404': { description: 'Not found or already revoked' }
