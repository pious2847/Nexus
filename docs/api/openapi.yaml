openapi: 3.0.3
info:
  title: N.E.X.U.S. API
  version: 3.0.0
  description: >
    National multi-hazard disaster-intelligence platform for Ghana. This spec covers
    the full TypeScript core API mounted by `nexus-backend/src/core/http/register.ts`
    (Phases 0-3: identity/geography, multi-hazard early warning, life-safety, emergency
    response, admin/analytics, and the Data Hub). Legacy sanitation endpoints under
    `/api/v1/*` (controllers in `src/controllers`) are a separate, still-running system
    and are not covered here.

    **Auth model**: most routes take a `Bearer` JWT (see `POST /auth-v2/otp/verify` to
    obtain one). A JWT alone is not sufficient for most mutating routes — the bearer's
    RBAC v2 role grants (see `/admin/users/:id/roles`) determine which `permission`
    checks pass. Every protected route below documents its required permission and
    whether the check is **geo-scoped** (the caller's grant must cover the target
    place, or an ancestor of it) or **national-scope** (only a grant with no place
    restriction passes, regardless of the target). A handful of routes accept an
    `X-API-Key` header instead of a JWT (Data Hub dataset downloads only).

    **Envelope**: nearly every JSON response is `{ success, data?, count?, message?,
    errors? }`. A few routes deliberately return a raw payload instead (GeoJSON map/
    boundary endpoints, the printable notice-sheet HTML) — each is called out where it
    applies.
servers:
  - url: http://localhost:5000/api/v1
    description: Local dev (legacy Express app; TS core routers mounted alongside)
  - url: http://localhost:5091/api/v1
    description: Local dev (tsx runtime, port used throughout this session's live verification)

tags:
  - { name: Auth, description: Phone-OTP login, token refresh/logout }
  - { name: Geography, description: Ghana's 16-region/261-district place tree, boundaries }
  - { name: Hazards, description: Hazard types + the hazard-event lifecycle state machine }
  - { name: Hazard Map, description: National multi-hazard map (GeoJSON), historical playback }
  - { name: Incident Reports, description: Citizen incident reporting, verification, AI triage, promotion to a hazard event }
  - { name: Warnings, description: CAP-aligned alert drafting/publishing, signing/verification, accessibility }
  - { name: Notifications, description: In-app notifications, per-place subscriptions, channel preferences, web-push }
  - { name: SMS Intake, description: Inbound SMS webhook (reports/check-ins/SOS by keyword) }
  - { name: Vulnerable Persons, description: Pre-disaster evacuation-assistance registry (N4) }
  - { name: Health Facilities, description: Facility registry + live capacity (N16) }
  - { name: Health Cases, description: Disease case surveillance }
  - { name: Safety Check-ins, description: "\"I'm Safe\" check-ins (N1)" }
  - { name: SOS, description: SOS / panic-button alerts (N2) }
  - { name: Community Focal Points, description: Last-mile relay registry (N6) }
  - { name: Missing Persons, description: Missing-persons & family reunification (N3) }
  - { name: Rumors, description: Rumor intake, review, and official myth-vs-fact clarifications (N11) }
  - { name: Anticipatory Action, description: Forecast-based trigger protocols (N12) }
  - { name: Evacuation, description: Hazard-aware nearest-safe-place suggestions (N7) }
  - { name: Common Operating Picture, description: Per-event command-center aggregation + ICS roles (N14) }
  - { name: Shelters, description: Shelter/safe-zone registry + occupancy }
  - { name: Relief, description: Relief stock levels + distributions }
  - { name: Dispatch, description: Incident dispatch/task board }
  - { name: Volunteers, description: Volunteer roster + task matching }
  - { name: Response Assets, description: Vehicles/boats/equipment registry }
  - { name: Response Timeline, description: Merged after-action timeline for a hazard event }
  - { name: Admin, description: System health, integration status (super_admin) }
  - { name: Admin Users, description: User account + role-grant management }
  - { name: Admin Organizations, description: Organization/team management }
  - { name: Assessments, description: Rapid damage & needs assessment + situation reports (N15) }
  - { name: Analytics, description: Cross-module executive summary + trend charts }
  - { name: Badges, description: Light gamification for verified citizen reporters }
  - { name: Data Hub, description: Dataset catalog, sharing modes, request workflow, API keys }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Obtain via `POST /auth-v2/otp/verify`. The JWT alone grants identity; RBAC v2
        permission grants (managed via `/admin/users/:id/roles`) determine what the
        bearer can actually do — see each route's `x-permission` note.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Data Hub partner integration key (`POST /datahub/api-keys`). Alternative to a
        JWT on `GET /datahub/datasets/:id/download` only. Grants download access
        equivalent to the issuing org's membership — never catalog-curation rights.

  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        count: { type: integer }
        data: {}
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors:
          type: object
          description: Present on 400s from Zod validation failures (`.flatten()` shape).
          properties:
            formErrors: { type: array, items: { type: string } }
            fieldErrors: { type: object, additionalProperties: { type: array, items: { type: string } } }

    Place:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        level: { type: string, enum: [country, region, district, constituency, community] }
        code: { type: string, nullable: true }
        name: { type: string }
        category: { type: string, nullable: true }
        population: { type: integer, nullable: true }
        path: { type: string, description: ltree path, e.g. 'ghana.northern.tolon' }

    Tokens:
      type: object
      properties:
        user: { type: object }
        accessToken: { type: string }
        refreshToken: { type: string }

    HazardType:
      type: object
      properties:
        code: { type: string, example: flood }
        label: { type: string }
        category: { type: string }
        default_thresholds: { type: object }
        signal_sources: { type: object }
        evaluator_key: { type: string }
        lead_time_hours: { type: integer, nullable: true }
        enabled: { type: boolean }

    HazardEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        hazard_type: { type: string, enum: [flood, heavy_rainfall, drought, bushfire, disease_outbreak, windstorm, extreme_heat, sanitation_failure] }
        place_id: { type: string, format: uuid, nullable: true }
        state: { type: string, enum: [predicted, watch, warning, active, response, recovery, closed] }
        severity: { type: string, enum: [minor, moderate, severe, extreme], nullable: true }
        urgency: { type: string, nullable: true }
        certainty: { type: string, nullable: true }
        color: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        impact_summary: { type: object }
        started_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        source: { type: string, enum: [manual, auto] }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        is_drill: { type: boolean, description: "N13 — a drill event; excluded from the public hazard map + analytics, real fan-out suppressed." }

    EventTransition:
      type: object
      properties:
        from_state: { type: string, nullable: true }
        to_state: { type: string }
        actor_id: { type: string, format: uuid, nullable: true }
        reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    IncidentReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        reporter_id: { type: string, format: uuid, nullable: true }
        reporter_phone: { type: string, nullable: true }
        hazard_type: { type: string, nullable: true }
        place_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        media: { type: array, items: { type: string, format: uri } }
        status: { type: string, enum: [submitted, pending, verified, rejected] }
        confidence: { type: number }
        corroboration_count: { type: integer }
        cluster_id: { type: string, format: uuid, nullable: true }
        verified_by: { type: string, format: uuid, nullable: true }
        promoted_event_id: { type: string, format: uuid, nullable: true }
        source: { type: string, enum: [pwa, sms, whatsapp, voice] }
        created_at: { type: string, format: date-time }

    TriageSuggestion:
      type: object
      description: AI-assisted (Gemini) triage suggestion. Advisory only — never mutates the report.
      properties:
        suggestedStatus: { type: string, enum: [verified, pending, rejected] }
        suggestedHazardType: { type: string, nullable: true }
        confidencePercent: { type: integer, minimum: 0, maximum: 100 }
        reasoning: { type: string }
        duplicateLikely: { type: boolean }
        available: { type: boolean, description: false if GEMINI_API_KEY unset or the call failed — a graceful degrade, not an error. }

    Warning:
      type: object
      properties:
        id: { type: string, format: uuid }
        hazard_event_id: { type: string, format: uuid, nullable: true }
        place_id: { type: string, format: uuid, nullable: true }
        category: { type: string }
        event_type: { type: string, description: "Human-readable label (e.g. 'Flood Warning'), NOT the hazard_type machine code." }
        severity: { type: string }
        urgency: { type: string }
        certainty: { type: string }
        headline: { type: string }
        description: { type: string, nullable: true }
        instruction: { type: string, nullable: true }
        area_desc: { type: string, nullable: true }
        status: { type: string, enum: [draft, published] }
        recipients: { type: integer }
        sms_attempted: { type: integer }
        sms_delivered: { type: integer }
        whatsapp_attempted: { type: integer }
        whatsapp_delivered: { type: integer }
        email_attempted: { type: integer }
        email_delivered: { type: integer }
        focal_points_notified: { type: integer }
        signature: { type: string, nullable: true }
        signing_key_id: { type: string, nullable: true }
        signed_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AccessibleAlert:
      type: object
      description: N5 — accessibility & no-literacy alerting.
      properties:
        icon: { type: string, example: "🌊" }
        color: { type: string, nullable: true, example: "#EF6C00" }
        audioScript: { type: string, description: Short plain-language script written for text-to-speech / read-aloud. }
        pictogramDescription: { type: string }

    NotificationRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        data: { type: object }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    VulnerablePerson:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        full_name: { type: string }
        category: { type: string, enum: [elderly, disabled, pregnant, chronic_illness, bedridden, unaccompanied_minor, other] }
        mobility_level: { type: string, enum: [independent, needs_assistance, wheelchair, bedridden] }
        household_contact_phone: { type: string, nullable: true }
        household_size: { type: integer, nullable: true }
        special_needs: { type: string, nullable: true }
        consent_status: { type: string, enum: [pending, given, guardian_given, declined] }
        consent_by: { type: string, enum: [self, guardian, reporter_observed], nullable: true }
        status: { type: string, enum: [active, evacuated, deceased, withdrawn] }
        registered_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HealthFacility:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        name: { type: string }
        facility_type: { type: string, enum: [clinic, hospital, chps_compound, health_center] }
        ownership: { type: string, enum: [government, private, mission, ngo], nullable: true }
        contact_phone: { type: string, nullable: true }
        bed_count: { type: integer, nullable: true }
        status: { type: string, enum: [active, closed] }
        created_at: { type: string, format: date-time }

    HealthFacilityCapacity:
      type: object
      description: "N16 — insert-only time series; every report is a new row, not an overwrite."
      properties:
        id: { type: string, format: uuid }
        facility_id: { type: string, format: uuid }
        beds_available: { type: integer, nullable: true }
        blood_units_available: { type: integer, nullable: true }
        ambulances_available: { type: integer, nullable: true }
        status: { type: string, enum: [normal, strained, overwhelmed, closed] }
        reported_at: { type: string, format: date-time }

    DiseaseCase:
      type: object
      properties:
        id: { type: string, format: uuid }
        disease_code: { type: string }
        place_id: { type: string, format: uuid }
        facility_id: { type: string, format: uuid, nullable: true }
        case_status: { type: string, enum: [suspected, probable, confirmed, ruled_out] }
        source: { type: string, enum: [facility, field_worker, citizen] }
        age_group: { type: string, nullable: true }
        sex: { type: string, nullable: true }
        onset_date: { type: string, format: date, nullable: true }
        reported_at: { type: string, format: date-time }
        notes: { type: string, nullable: true }

    SafetyCheckin:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        hazard_event_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [safe, need_help, injured] }
        subject_name: { type: string, nullable: true }
        reporter_phone: { type: string, nullable: true }
        source: { type: string }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    SosAlert:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid, nullable: true }
        geometry: { type: object, description: GeoJSON Point (NOT NULL — SOS always carries a location) }
        location_precision: { type: string, enum: [gps, district_centroid] }
        status: { type: string, enum: [open, acknowledged, resolved, false_alarm] }
        danger_type: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        reporter_phone: { type: string, nullable: true }
        responders_notified: { type: integer }
        acknowledged_by: { type: string, format: uuid, nullable: true }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, format: uuid, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CommunityFocalPoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        name: { type: string }
        relay_method: { type: string, enum: [door_to_door, gong_gong, loudhailer, radio_broadcast, notice_board] }
        station_name: { type: string, nullable: true }
        contact_phone: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        active: { type: boolean }

    MissingPerson:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        full_name: { type: string }
        age_estimate: { type: string, nullable: true }
        sex: { type: string, nullable: true }
        distinguishing_features: { type: string, nullable: true }
        photo_url: { type: string, nullable: true }
        last_seen_lng: { type: number, nullable: true }
        last_seen_lat: { type: number, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        reporter_id: { type: string, format: uuid, nullable: true }
        reporter_phone: { type: string }
        relationship_to_missing: { type: string, nullable: true }
        status: { type: string, enum: [missing, found, reunified, closed] }
        matched_checkin_id: { type: string, format: uuid, nullable: true }
        matched_vulnerable_person_id: { type: string, format: uuid, nullable: true }
        resolved_by: { type: string, format: uuid, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    MissingPersonMatchResult:
      type: object
      description: "pg_trgm similarity() candidates (threshold >0.3) — discovery only, never an automatic match."
      properties:
        missingPerson: { $ref: '#/components/schemas/MissingPerson' }
        candidates:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [safety_checkin, vulnerable_person] }
              score: { type: number }
              record: { type: object }

    RumorReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid, nullable: true }
        hazard_event_id: { type: string, format: uuid, nullable: true }
        description: { type: string }
        source: { type: string, nullable: true }
        reporter_id: { type: string, format: uuid, nullable: true }
        reporter_phone: { type: string, nullable: true }
        status: { type: string, enum: [reported, reviewing, confirmed_false, confirmed_true, clarified] }
        reviewed_by: { type: string, format: uuid, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        resolution_notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    MythFactEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        hazard_event_id: { type: string, format: uuid, nullable: true }
        place_id: { type: string, format: uuid, nullable: true }
        myth: { type: string }
        fact: { type: string }
        rumor_report_id: { type: string, format: uuid, nullable: true }
        published_by: { type: string, format: uuid }
        channels_notified: { type: object, example: { focalPointsNotified: 3 } }
        created_at: { type: string, format: date-time }

    AnticipatoryProtocol:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hazard_type: { type: string }
        place_id: { type: string, format: uuid }
        trigger_state: { type: string }
        actions:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [notify_focal_points, flag_vulnerable_evacuation, pre_position_relief] }
              params: { type: object }
        active: { type: boolean }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    ProtocolActivation:
      type: object
      properties:
        id: { type: string, format: uuid }
        protocol_id: { type: string, format: uuid }
        hazard_event_id: { type: string, format: uuid }
        actions_taken: { type: array, items: { type: object } }
        triggered_at: { type: string, format: date-time }

    EvacuationSuggestion:
      type: object
      description: "N7 — honest scope: hazard-aware ranking + straight-line heading, NOT road-network routing."
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [shelter, health_facility] }
        name: { type: string }
        place_id: { type: string, format: uuid }
        lng: { type: number }
        lat: { type: number }
        capacity: { type: integer, nullable: true }
        current_occupancy: { type: integer, nullable: true }
        meters: { type: number, description: straight-line distance from the query point }
        hazard_affected: { type: boolean, description: "true if this place currently has an active severe/extreme hazard — deprioritized, never silently excluded." }
        hazard_types: { type: array, items: { type: string } }
        heading:
          type: object
          properties:
            bearingDegrees: { type: integer }
            compassPoint: { type: string, example: NE }
            distanceMeters: { type: integer }

    Shelter:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        name: { type: string }
        capacity: { type: integer, nullable: true }
        current_occupancy: { type: integer }
        facilities: { type: array, items: { type: string } }
        status: { type: string, enum: [open, full, closed] }
        contact_phone: { type: string, nullable: true }
        managed_by: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReliefStock:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        shelter_id: { type: string, format: uuid, nullable: true }
        item_type: { type: string, enum: [food, water, tents, medical_kits, blankets, other] }
        quantity: { type: integer }
        unit: { type: string }
        low_stock_threshold: { type: integer }
        updated_at: { type: string, format: date-time }

    ReliefDistribution:
      type: object
      properties:
        id: { type: string, format: uuid }
        stock_id: { type: string, format: uuid }
        hazard_event_id: { type: string, format: uuid, nullable: true }
        quantity: { type: integer }
        recipient_desc: { type: string, nullable: true }
        distributed_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    DispatchTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        hazard_event_id: { type: string, format: uuid, nullable: true }
        place_id: { type: string, format: uuid, nullable: true }
        task_type: { type: string, enum: [rescue, assessment, distribution, repair, other] }
        description: { type: string, nullable: true }
        priority: { type: string, enum: [low, normal, high, critical] }
        status: { type: string, enum: [open, assigned, in_progress, done, cancelled] }
        assigned_to: { type: string, format: uuid, nullable: true }
        source_type: { type: string, nullable: true }
        source_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    DispatchTaskEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        from_status: { type: string, nullable: true }
        to_status: { type: string }
        actor_id: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Volunteer:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        phone: { type: string, nullable: true }
        place_id: { type: string, format: uuid }
        skills: { type: array, items: { type: string } }
        availability: { type: string, enum: [available, unavailable, deployed] }
        assigned_task: { type: string, format: uuid, nullable: true }

    ResponseAsset:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        asset_type: { type: string, enum: [vehicle, boat, equipment, other] }
        place_id: { type: string, format: uuid }
        status: { type: string, enum: [available, deployed, maintenance] }
        assigned_task: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }

    TimelineEntry:
      type: object
      description: Merged chronologically from dispatch_task_events + relief_distributions.
      properties:
        type: { type: string, enum: [dispatch_event, relief_distribution] }
        occurred_at: { type: string, format: date-time }
        detail: { type: object }

    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        status: { type: string, enum: [active, suspended] }
        reputation_score: { type: integer }
        org_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        roles:
          type: array
          nullable: true
          items:
            type: object
            properties:
              roleCode: { type: string }
              placeId: { type: string, format: uuid, nullable: true }
              placeName: { type: string, nullable: true }

    RoleGrant:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role_code: { type: string }
        place_id: { type: string, format: uuid, nullable: true }
        place_name: { type: string, nullable: true }
        granted_by: { type: string, format: uuid, nullable: true }
        granted_at: { type: string, format: date-time }

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [ngo, government_agency, assembly, research, media, other] }
        verified: { type: boolean }
        contact: { type: object }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DamageAssessment:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        hazard_event_id: { type: string, format: uuid, nullable: true }
        households_affected: { type: integer }
        persons_affected: { type: integer }
        casualties: { type: integer }
        injuries: { type: integer }
        infrastructure_damage: { type: string, nullable: true }
        urgent_needs: { type: array, items: { type: string } }
        notes: { type: string, nullable: true }
        assessed_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    SituationReport:
      type: object
      properties:
        scopePlaceId: { type: string, format: uuid }
        hazardEventId: { type: string, format: uuid, nullable: true }
        totalAssessments: { type: integer }
        householdsAffected: { type: integer }
        personsAffected: { type: integer }
        casualties: { type: integer }
        injuries: { type: integer }
        urgentNeeds:
          type: array
          items:
            type: object
            properties: { need: { type: string }, count: { type: integer } }

    IcsRole:
      type: object
      properties:
        id: { type: string, format: uuid }
        hazard_event_id: { type: string, format: uuid }
        role_title: { type: string, enum: [incident_commander, operations, planning, logistics, finance_admin, safety_officer, liaison_officer, public_information_officer] }
        user_id: { type: string, format: uuid }
        user_name: { type: string }
        assigned_by: { type: string, format: uuid, nullable: true }
        assigned_at: { type: string, format: date-time }
        relieved_at: { type: string, format: date-time, nullable: true }

    CopSnapshot:
      type: object
      description: "N14 — one-call aggregation of everything already linked to a hazard event."
      properties:
        event:
          type: object
          properties:
            id: { type: string, format: uuid }
            hazard_type: { type: string }
            place_id: { type: string, format: uuid, nullable: true }
            title: { type: string }
            state: { type: string }
            severity: { type: string, nullable: true }
            started_at: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time }
        counts:
          type: object
          properties:
            reports_linked: { type: integer }
            reports_in_area: { type: integer }
            dispatch_open: { type: integer }
            dispatch_in_progress: { type: integer }
            dispatch_done: { type: integer }
            checkins_safe: { type: integer }
            checkins_need_help: { type: integer }
            checkins_injured: { type: integer }
            sos_open: { type: integer }
            sos_acknowledged: { type: integer }
            shelters_open: { type: integer }
            shelters_full: { type: integer }
            shelter_occupancy: { type: integer }
            shelter_capacity: { type: integer }
            relief_distributions: { type: integer }
            rumors_open: { type: integer }
        situationReport: { allOf: [{ $ref: '#/components/schemas/SituationReport' }], nullable: true }
        commandRoles: { type: array, items: { $ref: '#/components/schemas/IcsRole' } }

    ExecutiveSummary:
      type: object
      properties:
        activeHazardsBySeverity:
          type: array
          items: { type: object, properties: { severity: { type: string, nullable: true }, count: { type: integer } } }
        reports30d:
          type: object
          properties: { total: { type: integer }, verified: { type: integer }, pending: { type: integer } }
        diseaseCases30d:
          type: array
          items: { type: object, properties: { disease_code: { type: string }, count: { type: integer } } }
        dispatchTasksByStatus:
          type: array
          items: { type: object, properties: { status: { type: string }, count: { type: integer } } }
        sos30d:
          type: object
          properties: { open: { type: integer }, acknowledged: { type: integer }, avgAckSeconds: { type: integer, nullable: true } }
        shelters:
          type: object
          properties:
            open: { type: integer }
            full: { type: integer }
            closed: { type: integer }
            totalCapacity: { type: integer }
            totalOccupancy: { type: integer }
        vulnerablePersons: { type: integer }

    MonthlyHazardTrend:
      type: object
      properties:
        month: { type: string, example: '2026-07' }
        hazard_type: { type: string }
        count: { type: integer }

    Badge:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string, nullable: true }
        criteria_type: { type: string, enum: [verified_count, reputation_threshold] }
        criteria_value: { type: integer }

    UserBadge:
      allOf:
        - $ref: '#/components/schemas/Badge'
        - type: object
          properties: { awarded_at: { type: string, format: date-time } }

    LeaderboardEntry:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        reputation_score: { type: integer }
        verified_count: { type: integer }
        badge_count: { type: integer }

    Dataset:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        place_id: { type: string, format: uuid, nullable: true }
        time_range_start: { type: string, format: date, nullable: true }
        time_range_end: { type: string, format: date, nullable: true }
        format: { type: string, enum: [csv, geojson, excel, pdf, json] }
        file_url: { type: string, nullable: true }
        file_size_bytes: { type: integer, nullable: true }
        row_count: { type: integer, nullable: true }
        license: { type: string, enum: [cc_by, cc_by_sa, cc0, open_data, restricted, proprietary] }
        attribution: { type: string, nullable: true }
        sharing_mode: { type: string, enum: [public, by_request, private] }
        contains_pii: { type: boolean, description: "A dataset can never be public AND contains_pii=true — enforced by a DB CHECK constraint plus an app-layer 400." }
        status: { type: string, enum: [draft, pending_review, published, rejected, archived] }
        org_id: { type: string, format: uuid, nullable: true }
        created_by: { type: string, format: uuid, nullable: true }
        reviewed_by: { type: string, format: uuid, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DataRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        dataset_id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        requester_name: { type: string }
        justification: { type: string }
        status: { type: string, enum: [pending, approved, denied] }
        reviewed_by: { type: string, format: uuid, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        review_notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    DatasetUsageStats:
      type: object
      properties:
        total_downloads: { type: integer }
        unique_downloaders: { type: integer }
        requests_pending: { type: integer }
        requests_approved: { type: integer }
        requests_denied: { type: integer }

    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        key_prefix: { type: string, description: First 14 chars of the raw key, for display only. }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }

    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            rawKey: { type: string, description: "Shown ONCE, here, at creation. Never returned again — only key_hash is persisted." }

  responses:
    BadRequest:
      description: Validation failure or a business-rule error.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Missing/invalid bearer token.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Authenticated, but the caller's RBAC grants don't cover this permission/place.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Service health
      security: []
      responses:
        '200': { description: OK }

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth-v2/otp/request:
    post:
      tags: [Auth]
      summary: Request a phone login OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone], properties: { phone: { type: string, example: '+233201234567' } } }
      responses:
        '200': { description: 'OTP sent (data: { sent, expiresAt, devCode? })' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: Resend cooldown not elapsed }

  /auth-v2/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and log in (creates a citizen account on first login)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone, code], properties: { phone: { type: string }, code: { type: string, example: '123456' } } }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties: { data: { $ref: '#/components/schemas/Tokens' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid/expired/too-many-attempts code }

  /auth-v2/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        '200': { description: New token pair }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid/expired refresh token }

  /auth-v2/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        '200': { description: Logged out }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ── Geography ─────────────────────────────────────────────────────────────
  /geography/regions:
    get:
      tags: [Geography]
      summary: List the 16 regions
      security: []
      responses:
        '200':
          description: Regions
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/Place' } } } }]

  /geography/districts:
    get:
      tags: [Geography]
      summary: List districts (optionally filtered by region)
      security: []
      parameters:
        - { in: query, name: region, schema: { type: string }, description: Region name or id }
      responses:
        '200': { description: 'Districts (count + data[])' }

  /geography/resolve:
    get:
      tags: [Geography]
      summary: Resolve a free-text district string to a place (normalized + fuzzy)
      security: []
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, example: Sagnarigu } }
      responses:
        '200': { description: 'Resolve result { placeId, name, matchType, distance } or null' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /geography/district-for-point:
    get:
      tags: [Geography]
      summary: District whose boundary contains a point
      security: []
      parameters:
        - { in: query, name: lng, required: true, schema: { type: number } }
        - { in: query, name: lat, required: true, schema: { type: number } }
      responses:
        '200': { description: Containing district (Place) or null }
        '400': { $ref: '#/components/responses/BadRequest' }

  /geography/boundaries:
    get:
      tags: [Geography]
      summary: Bulk boundary FeatureCollection
      description: >
        **Not envelope-wrapped** — returns a raw GeoJSON `FeatureCollection` directly:
        `{ type, features: [{ type, geometry, properties: { id, name, level, hasGeometry } }], meta: { count, generatedAt, layer } }`.
        A district with no stored boundary gets `geometry: null, hasGeometry: false` rather than being dropped.
      security: []
      parameters:
        - { in: query, name: level, schema: { type: string, default: district } }
        - { in: query, name: region, schema: { type: string } }
      responses:
        '200': { description: FeatureCollection }

  /geography/{id}/boundary:
    get:
      tags: [Geography]
      summary: Single place's boundary
      description: "**Not envelope-wrapped** — returns a raw GeoJSON `Feature` directly."
      security: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: GeoJSON Feature }
        '404': { description: 'Place not found, or has no boundary geometry yet' }

  # ── Hazards ───────────────────────────────────────────────────────────────
  /hazards/types:
    get:
      tags: [Hazards]
      summary: List hazard types (config-driven registry)
      security: []
      responses:
        '200':
          description: Hazard types
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/HazardType' } } } }] } } }

  /hazards/types/{code}:
    patch:
      tags: [Hazards]
      summary: Edit a hazard type's runtime config (thresholds, label, lead time, enabled)
      description: 'x-permission: `config.manage` (national-scope)'
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                category: { type: string }
                thresholds: { type: object }
                leadTimeHours: { type: integer, nullable: true }
                enabled: { type: boolean }
      responses:
        '200': { description: Updated HazardType }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hazards/events:
    get:
      tags: [Hazards]
      summary: List hazard events
      security: []
      parameters:
        - { in: query, name: type, schema: { type: string }, description: hazard type code }
        - { in: query, name: place, schema: { type: string, format: uuid } }
        - { in: query, name: state, schema: { type: string } }
        - { in: query, name: severity, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer } }
      responses:
        '200': { description: 'count + data: HazardEvent[]' }
    post:
      tags: [Hazards]
      summary: Raise a new hazard event
      description: 'x-permission: `hazard.event.create` (geo-scoped to `placeId`, or national if omitted)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hazardType, title]
              properties:
                hazardType: { type: string, enum: [flood, heavy_rainfall, drought, bushfire, disease_outbreak, windstorm, extreme_heat, sanitation_failure] }
                placeId: { type: string, format: uuid }
                title: { type: string, minLength: 3 }
                description: { type: string }
                state: { type: string, enum: [predicted, watch, warning, active, response, recovery, closed] }
                severity: { type: string, enum: [minor, moderate, severe, extreme] }
                urgency: { type: string }
                certainty: { type: string }
                confidence: { type: number }
                isDrill: { type: boolean, description: 'N13 — drill/test mode, default false' }
      responses:
        '201': { description: Created HazardEvent }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hazards/events/{id}:
    get:
      tags: [Hazards]
      summary: Hazard event detail + transition history
      security: []
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'HazardEvent + { transitions: EventTransition[] }' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hazards/events/{id}/transition:
    post:
      tags: [Hazards]
      summary: Transition a hazard event's lifecycle state
      description: >
        x-permission: `hazard.event.transition` (geo-scoped to the event's place). Validated against
        the forward-only state machine (predicted→watch→warning→active→response→recovery→closed).
        Also the trigger point for N12 anticipatory-action protocols (skipped for drills) and N9
        (fan-out is a separate `/warnings/from-event`+`/publish` call, not automatic here).
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toState]
              properties: { toState: { type: string, enum: [predicted, watch, warning, active, response, recovery, closed] }, reason: { type: string } }
      responses:
        '200': { description: Updated HazardEvent }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Illegal state transition }

  # ── Hazard Map ────────────────────────────────────────────────────────────
  /hazard-map/events:
    get:
      tags: [Hazard Map]
      summary: Active hazard-event features for the map
      description: >
        **Not envelope-wrapped** — raw GeoJSON `FeatureCollection`. Excludes closed events and,
        since N13, drills. Supports historical playback via `asOf`.
      security: []
      parameters:
        - { in: query, name: type, schema: { type: string } }
        - { in: query, name: severity, schema: { type: string } }
        - { in: query, name: region, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer } }
        - { in: query, name: asOf, schema: { type: string, format: date-time }, description: Reconstructs map state as of this past moment. }
      responses:
        '200': { description: FeatureCollection }
        '400': { $ref: '#/components/responses/BadRequest' }

  /hazard-map/districts:
    get:
      tags: [Hazard Map]
      summary: Per-district worst-case active severity (choropleth)
      description: "**Not envelope-wrapped** — raw GeoJSON `FeatureCollection`, one feature per district (all 261, even those lacking boundary geometry)."
      security: []
      responses:
        '200': { description: FeatureCollection }

  /hazard-map/summary:
    get:
      tags: [Hazard Map]
      summary: National active-event counts by hazard type + severity
      security: []
      responses:
        '200': { description: '{ totalActive, byHazard: { [type]: { total, bySeverity } } }' }

  # ── Incident Reports ──────────────────────────────────────────────────────
  /incident-reports:
    post:
      tags: [Incident Reports]
      summary: Submit a citizen incident report
      description: Works logged-out or in (optionalAuth); if logged in, reporter_id is attached and feeds N4 badges/reputation on later verification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                hazardType: { type: string }
                placeId: { type: string, format: uuid }
                lng: { type: number }
                lat: { type: number }
                title: { type: string, minLength: 3, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                media: { type: array, items: { type: string, format: uri } }
                source: { type: string, enum: [pwa, sms, whatsapp, voice] }
                reporterPhone: { type: string }
      responses:
        '201': { description: Created IncidentReport }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Incident Reports]
      summary: List incident reports
      description: 'x-permission: `report.read` (national-scope)'
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: type, schema: { type: string } }
        - { in: query, name: place, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer } }
      responses:
        '200': { description: 'count + data: IncidentReport[]' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /incident-reports/{id}:
    get:
      tags: [Incident Reports]
      summary: Incident report detail
      description: 'x-permission: `report.read` (national-scope)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: IncidentReport }
        '404': { $ref: '#/components/responses/NotFound' }

  /incident-reports/{id}/triage:
    post:
      tags: [Incident Reports]
      summary: AI-assisted triage suggestion (advisory only)
      description: 'x-permission: `report.verify` (geo-scoped to the report''s place). Never mutates the report.'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: TriageSuggestion
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { $ref: '#/components/schemas/TriageSuggestion' } } }] } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /incident-reports/{id}/review:
    post:
      tags: [Incident Reports]
      summary: Verify or reject a report
      description: 'x-permission: `report.verify` (geo-scoped). Adjusts reporter reputation; verification may award badges.'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [verified, rejected] }, reason: { type: string } } }
      responses:
        '200': { description: Updated IncidentReport }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /incident-reports/{id}/promote:
    post:
      tags: [Incident Reports]
      summary: Promote a report into a new hazard event (state watch)
      description: 'x-permission: `hazard.event.create` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { hazardType: { type: string }, severity: { type: string }, title: { type: string } }
      responses:
        '201': { description: '{ reportId, eventId }' }
        '400': { description: Invalid body, missing hazardType, or report not found (this route surfaces "not found" as 400, not 404) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Warnings ──────────────────────────────────────────────────────────────
  /warnings:
    get:
      tags: [Warnings]
      summary: List warnings
      security: []
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer } }
      responses:
        '200': { description: 'count + data: Warning[]' }

  /warnings/public-key:
    get:
      tags: [Warnings]
      summary: The Ed25519 public key used to sign published warnings
      security: []
      responses:
        '200': { description: '{ keyId, publicKeyPem, algorithm: "Ed25519" }' }
        '404': { description: Alert signing not configured }

  /warnings/{id}:
    get:
      tags: [Warnings]
      summary: Warning detail + its CAP JSON representation
      security: []
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'Warning + { cap: object }' }
        '404': { $ref: '#/components/responses/NotFound' }

  /warnings/{id}/verify:
    get:
      tags: [Warnings]
      summary: Independently recompute and verify a warning's Ed25519 signature
      description: Tamper-evident — mutating the stored row flips `verified:false` on re-check.
      security: []
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: '{ verified: boolean, signature, keyId, signedAt, cap }' }
        '404': { $ref: '#/components/responses/NotFound' }

  /warnings/{id}/notice-sheet:
    get:
      tags: [Warnings]
      summary: Printable community notice-board sheet
      description: "**Not envelope-wrapped** — returns self-contained HTML (`Content-Type: text/html`), not JSON."
      security: []
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: HTML page, content: { text/html: { schema: { type: string } } } }
        '404': { description: 'Plain text (not JSON): "Alert not found or not yet published."' }

  /warnings/{id}/accessible:
    get:
      tags: [Warnings]
      summary: 'N5 — accessible view: pictogram, colour, TTS-ready script'
      security: []
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: AccessibleAlert
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { $ref: '#/components/schemas/AccessibleAlert' } } }] } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /warnings/from-event:
    post:
      tags: [Warnings]
      summary: Draft a CAP alert from a hazard event (status = draft, not yet disseminated)
      description: >
        x-permission: `alert.publish.advisory` (national-scope at draft time — the actual
        tiered permission is enforced at publish time). If the source event `isDrill`, the
        headline is auto-prefixed with a TEST DRILL marker (inherited by every channel + the signature).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties: { eventId: { type: string, format: uuid }, headline: { type: string, maxLength: 200 }, instruction: { type: string, maxLength: 500 } }
      responses:
        '201': { description: Draft Warning }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /warnings/{id}/publish:
    post:
      tags: [Warnings]
      summary: Publish a draft warning — fans out to subscribers
      description: >
        x-permission: tiered — `alert.publish.{advisory|watch|severe|extreme}` depending on
        the warning's severity, geo-scoped to its place, enforced inside the service (not
        route middleware). Fans out in-app + SMS + WhatsApp + email + community focal points;
        signs the CAP payload if signing keys are configured.
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'Published Warning + a delivery-summary message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: 'PublishForbiddenError — insufficient tier for this severity/area' }

  # ── Notifications ─────────────────────────────────────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: The caller's own notifications
      parameters:
        - { in: query, name: unread, schema: { type: boolean } }
        - { in: query, name: limit, schema: { type: integer } }
      responses:
        '200': { description: 'count + data: NotificationRow[]' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark a notification read
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/subscriptions:
    get:
      tags: [Notifications]
      summary: The caller's place subscriptions
      responses:
        '200': { description: 'data: [{ place_id, channels, hazard_types }]' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Notifications]
      summary: Subscribe to a place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placeId, channels]
              properties:
                placeId: { type: string, format: uuid }
                channels: { type: array, minItems: 1, items: { type: string, enum: [in_app, push, sms, whatsapp, email, voice] } }
                hazardTypes: { type: array, items: { type: string } }
      responses:
        '201': { description: Subscribed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/subscriptions/{placeId}:
    delete:
      tags: [Notifications]
      summary: Unsubscribe from a place
      parameters: [{ in: path, name: placeId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Unsubscribed }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/preferences:
    get:
      tags: [Notifications]
      summary: The caller's per-channel opt-out preferences
      responses:
        '200': { description: 'data: [{ channel, enabled }]' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Notifications]
      summary: Set a channel preference
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [channel, enabled], properties: { channel: { type: string, enum: [in_app, push, sms, whatsapp, email, voice] }, enabled: { type: boolean } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/push:
    post:
      tags: [Notifications]
      summary: Register a web-push endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, p256dh, auth]
              properties: { endpoint: { type: string, format: uri }, p256dh: { type: string }, auth: { type: string } }
      responses:
        '201': { description: Registered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Notifications]
      summary: Unregister a web-push endpoint
      parameters: [{ in: query, name: endpoint, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── SMS Intake ────────────────────────────────────────────────────────────
  /sms-intake/inbound:
    post:
      tags: [SMS Intake]
      summary: Inbound SMS webhook — routes by keyword to reports / check-ins / SOS
      description: >
        Not for frontend use — this is the SMS provider's webhook target. Always returns
        200 (even on failure) to avoid webhook retry storms, except an invalid/missing
        `token` when `SMS_INBOUND_TOKEN` is configured (403). Payload is normalized via a
        defensive multi-alias adapter (Arkesel's inbound format isn't publicly documented).
      security: []
      parameters: [{ in: query, name: token, schema: { type: string }, description: Required only if SMS_INBOUND_TOKEN is set. }]
      responses:
        '200': { description: 'Always 200 on any parseable-or-not outcome — see description.' }
        '403': { description: Invalid/missing shared-secret token. }

  # ── Vulnerable Persons ────────────────────────────────────────────────────
  /vulnerable-persons:
    post:
      tags: [Vulnerable Persons]
      summary: Register a vulnerable person
      description: 'x-permission: `vulnerable.create` (geo-scoped)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, category, consentStatus]
              properties:
                placeId: { type: string, format: uuid }
                lng: { type: number }
                lat: { type: number }
                fullName: { type: string, minLength: 2, maxLength: 200 }
                category: { type: string, enum: [elderly, disabled, pregnant, chronic_illness, bedridden, unaccompanied_minor, other] }
                mobilityLevel: { type: string, enum: [independent, needs_assistance, wheelchair, bedridden], default: needs_assistance }
                householdContactPhone: { type: string }
                householdSize: { type: integer, minimum: 0, maximum: 50 }
                specialNeeds: { type: string, maxLength: 1000 }
                consentStatus: { type: string, enum: [pending, given, guardian_given, declined] }
                consentBy: { type: string, enum: [self, guardian, reporter_observed] }
      responses:
        '201': { description: Created VulnerablePerson }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Vulnerable Persons]
      summary: List within a geo scope
      description: 'x-permission: `vulnerable.read` (geo-scoped to `scope`, required — no national "list everyone" endpoint)'
      parameters:
        - { in: query, name: scope, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [priority] }, description: 'sort=priority ranks by category+mobility+household size' }
      responses:
        '200': { description: 'count + data: VulnerablePerson[]' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vulnerable-persons/{id}:
    get:
      tags: [Vulnerable Persons]
      summary: Detail
      description: 'x-permission: `vulnerable.read` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: VulnerablePerson }
        '404': { $ref: '#/components/responses/NotFound' }

  /vulnerable-persons/{id}/status:
    patch:
      tags: [Vulnerable Persons]
      summary: Update status (active/evacuated/deceased/withdrawn)
      description: 'x-permission: `vulnerable.manage` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [active, evacuated, deceased, withdrawn] } } } } }
      responses:
        '200': { description: Updated VulnerablePerson }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vulnerable-persons/{id}/consent:
    patch:
      tags: [Vulnerable Persons]
      summary: Update consent
      description: 'x-permission: `vulnerable.manage` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [consentStatus], properties: { consentStatus: { type: string, enum: [pending, given, guardian_given, declined] }, consentBy: { type: string, enum: [self, guardian, reporter_observed] } } }
      responses:
        '200': { description: Updated VulnerablePerson }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Health Facilities ─────────────────────────────────────────────────────
  /health-facilities/nearest-with-capacity:
    get:
      tags: [Health Facilities]
      summary: Nearest facility with a filed capacity report matching filters
      security: []
      parameters:
        - { in: query, name: lng, required: true, schema: { type: number } }
        - { in: query, name: lat, required: true, schema: { type: number } }
        - { in: query, name: minBeds, schema: { type: integer } }
        - { in: query, name: status, schema: { type: string, enum: [normal, strained, overwhelmed, closed] } }
        - { in: query, name: limit, schema: { type: integer, default: 5 } }
      responses:
        '200': { description: 'count + data' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /health-facilities:
    post:
      tags: [Health Facilities]
      summary: Register a health facility
      description: 'x-permission: `health.facility.create` (geo-scoped)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                placeId: { type: string, format: uuid }
                lng: { type: number }
                lat: { type: number }
                name: { type: string, minLength: 2, maxLength: 200 }
                facilityType: { type: string, enum: [clinic, hospital, chps_compound, health_center], default: clinic }
                ownership: { type: string, enum: [government, private, mission, ngo] }
                contactPhone: { type: string }
                bedCount: { type: integer, minimum: 0 }
      responses:
        '201': { description: Created HealthFacility }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Health Facilities]
      summary: List within a geo scope
      description: 'x-permission: `health.facility.read` (geo-scoped, `scope` required)'
      parameters:
        - { in: query, name: scope, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: facilityType, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        '200': { description: 'count + data: HealthFacility[]' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /health-facilities/{id}:
    get:
      tags: [Health Facilities]
      summary: Detail
      description: 'x-permission: `health.facility.read` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: HealthFacility }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Health Facilities]
      summary: Update
      description: 'x-permission: `health.facility.manage` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                facilityType: { type: string, enum: [clinic, hospital, chps_compound, health_center] }
                ownership: { type: string, enum: [government, private, mission, ngo] }
                contactPhone: { type: string }
                bedCount: { type: integer }
                status: { type: string, enum: [active, closed] }
      responses:
        '200': { description: Updated HealthFacility }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /health-facilities/{id}/capacity:
    post:
      tags: [Health Facilities]
      summary: 'N16 — file a new live capacity report (insert-only, not an overwrite)'
      description: 'x-permission: `health.facility.manage` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                bedsAvailable: { type: integer, minimum: 0 }
                bloodUnitsAvailable: { type: integer, minimum: 0 }
                ambulancesAvailable: { type: integer, minimum: 0 }
                status: { type: string, enum: [normal, strained, overwhelmed, closed] }
      responses:
        '201': { description: HealthFacilityCapacity }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Health Facilities]
      summary: Latest capacity report
      description: 'x-permission: `health.facility.read` (geo-scoped). `200 data:null` is valid — a facility with zero reports is not a 404.'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'HealthFacilityCapacity or null' }
        '404': { description: Facility itself not found. }

  # ── Health Cases ──────────────────────────────────────────────────────────
  /health-cases:
    post:
      tags: [Health Cases]
      summary: Report a disease case
      description: 'x-permission: `health.case.create` (geo-scoped)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diseaseCode]
              properties:
                placeId: { type: string, format: uuid }
                lng: { type: number }
                lat: { type: number }
                diseaseCode: { type: string, pattern: '^[a-z0-9_-]+$', description: normalized to lowercase }
                caseStatus: { type: string, enum: [suspected, probable, confirmed, ruled_out], default: suspected }
                source: { type: string, enum: [facility, field_worker, citizen], default: facility }
                ageGroup: { type: string, enum: ['0-4', '5-14', '15-49', '50+', unknown] }
                sex: { type: string, enum: [M, F, unknown] }
                onsetDate: { type: string, format: date }
                notes: { type: string, maxLength: 1000 }
                facilityId: { type: string, format: uuid }
      responses:
        '201': { description: Created DiseaseCase }
        '400': { description: Invalid body, unresolvable place, or unknown diseaseCode (FK violation) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Health Cases]
      summary: List within a geo scope
      description: 'x-permission: `health.case.read` (geo-scoped, `scope` required)'
      parameters:
        - { in: query, name: scope, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: diseaseCode, schema: { type: string } }
        - { in: query, name: caseStatus, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: 'count + data: DiseaseCase[]' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /health-cases/{id}:
    get:
      tags: [Health Cases]
      summary: Detail
      description: 'x-permission: `health.case.read` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: DiseaseCase }, '404': { $ref: '#/components/responses/NotFound' } }

  # ── Safety Check-ins ──────────────────────────────────────────────────────
  /safety-checkins:
    post:
      tags: [Safety Check-ins]
      summary: "\"I'm Safe\" check-in — self or on behalf of someone else"
      description: 'x-permission: `safety.checkin.create` (geo-scoped). Auto-links to the most recent open hazard event covering the place.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                placeId: { type: string, format: uuid }
                lng: { type: number }
                lat: { type: number }
                status: { type: string, enum: [safe, need_help, injured] }
                subjectName: { type: string, minLength: 2, maxLength: 200 }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Created SafetyCheckin }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Safety Check-ins]
      summary: List within a geo scope
      description: 'x-permission: `safety.checkin.read` (geo-scoped, `scope` required)'
      parameters:
        - { in: query, name: scope, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        '200': { description: 'count + data: SafetyCheckin[]' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /safety-checkins/event/{eventId}/summary:
    get:
      tags: [Safety Check-ins]
      summary: Aggregated safe/need_help/injured counts for a hazard event
      description: 'x-permission: `safety.checkin.read` (geo-scoped to the event''s place)'
      parameters: [{ in: path, name: eventId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: 'Aggregated summary counts' } }

  /safety-checkins/event/{eventId}:
    get:
      tags: [Safety Check-ins]
      summary: Check-ins for a hazard event
      description: 'x-permission: `safety.checkin.read` (geo-scoped)'
      parameters: [{ in: path, name: eventId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: 'count + data: SafetyCheckin[]' } }

  # ── SOS ───────────────────────────────────────────────────────────────────
  /sos:
    post:
      tags: [SOS]
      summary: Raise an SOS / panic-button alert
      description: >
        x-permission: `sos.create` (**national-scope** — every account holds a national grant,
        so this is never geo-blocked). Immediately SMS + in-app notifies every eligible
        responder covering the place, and (if Module M is wired) auto-creates a critical
        dispatch task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lng, lat]
              properties: { lng: { type: number }, lat: { type: number }, dangerType: { type: string }, notes: { type: string, maxLength: 500 } }
      responses:
        '201': { description: Created SosAlert }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [SOS]
