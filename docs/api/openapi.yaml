              properties: { status: { type: string, enum: [reported, reviewing, confirmed_false, confirmed_true, clarified] }, resolutionNotes: { type: string, nullable: true } }
      responses:
        '200': { description: Updated RumorReport }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

