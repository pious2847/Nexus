                lat: { type: number }
                hazardEventId: { type: string, format: uuid }
                description: { type: string, minLength: 2, maxLength: 4000 }
                source: { type: string, maxLength: 200 }
                reporterPhone: { type: string }
      responses:
        '201': { description: Created RumorReport }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Rumors]
      summary: List within a geo scope
      description: 'x-permission: `rumor.read` (geo-scoped, `scope` required)'
      parameters:
        - { in: query, name: scope, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        '200': { description: 'count + data: RumorReport[]' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /rumors/{id}:
    get:
      tags: [Rumors]
      summary: Detail
      description: 'x-permission: `rumor.read` (geo-scoped; national for an unscoped rumor)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: RumorReport }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Rumors]
      summary: Review a rumor
      description: 'x-permission: `rumor.manage` (geo-scoped; national for an unscoped rumor)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
