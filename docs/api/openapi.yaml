  /hazards/events/{id}/cop:
    get:
      tags: [Common Operating Picture]
      summary: One-call command-center aggregation for a hazard event
      description: 'x-permission: `command.read` (geo-scoped to the event''s place)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: CopSnapshot
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { $ref: '#/components/schemas/CopSnapshot' } } }] } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

