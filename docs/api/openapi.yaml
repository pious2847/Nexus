    patch:
      tags: [Shelters]
      summary: Update
      description: 'x-permission: `shelter.manage` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
