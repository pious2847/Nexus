    post:
      tags: [Common Operating Picture]
      summary: Assign an ICS role for this event (auto-relieves any current holder)
      description: 'x-permission: `command.manage` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
