  # ── Missing Persons ───────────────────────────────────────────────────────
  /missing-persons:
    post:
      tags: [Missing Persons]
      summary: Report a missing person
      description: 'x-permission: `missing.report` (geo-scoped). Sensitive PII — no public route on this router.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, reporterPhone]
              properties:
                placeId: { type: string, format: uuid }
                lng: { type: number }
                lat: { type: number }
                fullName: { type: string, minLength: 2, maxLength: 200 }
                ageEstimate: { type: string, maxLength: 50 }
                sex: { type: string, maxLength: 20 }
                distinguishingFeatures: { type: string, maxLength: 2000 }
                photoUrl: { type: string }
                lastSeenAt: { type: string, format: date-time }
                reporterPhone: { type: string }
                relationshipToMissing: { type: string, maxLength: 100 }
                notes: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Created MissingPerson }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Missing Persons]
      summary: List within a geo scope
      description: 'x-permission: `missing.read` (geo-scoped, `scope` required)'
      parameters:
        - { in: query, name: scope, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        '200': { description: 'count + data: MissingPerson[]' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /missing-persons/{id}:
    get:
      tags: [Missing Persons]
      summary: Detail
      description: 'x-permission: `missing.read` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: MissingPerson }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Missing Persons]
      summary: Update status or record a match/resolution
      description: 'x-permission: `missing.manage` (geo-scoped). No forward-only state machine — any officer can move between all 4 statuses.'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [missing, found, reunified, closed] }
                matchedCheckinId: { type: string, format: uuid, nullable: true }
                matchedVulnerablePersonId: { type: string, format: uuid, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        '200': { description: Updated MissingPerson }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /missing-persons/{id}/matches:
    get:
      tags: [Missing Persons]
      summary: Ranked candidate matches (pg_trgm fuzzy name similarity)
      description: 'x-permission: `missing.read` (geo-scoped). Candidate discovery only — a human confirms via PATCH.'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: MissingPersonMatchResult
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { $ref: '#/components/schemas/MissingPersonMatchResult' } } }] } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Rumors ────────────────────────────────────────────────────────────────
  /rumors:
    post:
      tags: [Rumors]
      summary: Report a rumor for fact-checking
      description: 'x-permission: `rumor.report` (geo-scoped if resolvable, else national — an unresolved place is still accepted, unlike most other create routes)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                placeId: { type: string, format: uuid }
