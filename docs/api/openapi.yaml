  # ── Anticipatory Action ───────────────────────────────────────────────────
  /anticipatory/protocols:
    post:
      tags: [Anticipatory Action]
      summary: Configure a forecast-based trigger protocol
      description: 'x-permission: `anticipatory.manage` (geo-scoped to `placeId`)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, hazardType, placeId, triggerState, actions]
              properties:
                name: { type: string, minLength: 2, maxLength: 200 }
                hazardType: { type: string }
                placeId: { type: string, format: uuid }
                triggerState: { type: string, example: watch }
                actions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [type]
                    properties: { type: { type: string, enum: [notify_focal_points, flag_vulnerable_evacuation, pre_position_relief] }, params: { type: object } }
                active: { type: boolean }
      responses:
        '201': { description: Created AnticipatoryProtocol }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Anticipatory Action]
      summary: List within a geo scope
      description: 'x-permission: `anticipatory.read` (geo-scoped, `scope` required)'
      parameters:
        - { in: query, name: scope, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: hazardType, schema: { type: string } }
        - { in: query, name: active, schema: { type: boolean } }
      responses:
        '200': { description: 'count + data: AnticipatoryProtocol[]' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /anticipatory/protocols/{id}:
    get:
      tags: [Anticipatory Action]
      summary: Detail
      description: 'x-permission: `anticipatory.read` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: AnticipatoryProtocol }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Anticipatory Action]
      summary: Update
      description: 'x-permission: `anticipatory.manage` (geo-scoped)'
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                triggerState: { type: string }
                actions: { type: array, items: { type: object } }
                active: { type: boolean }
      responses:
        '200': { description: Updated AnticipatoryProtocol }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

