    get:
      tags: [Anticipatory Action]
      summary: Activation history within a geo scope
      description: 'x-permission: `anticipatory.read` (geo-scoped, `scope` required)'
      parameters: [{ in: query, name: scope, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 'count + data: ProtocolActivation[]'
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/ProtocolActivation' } } } }] } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ── Evacuation ────────────────────────────────────────────────────────────
  /evacuation/nearest-safe-place:
    get:
      tags: [Evacuation]
      summary: Hazard-aware nearest safe shelter/facility suggestions
      description: >
        Honest scope: straight-line heading + hazard-aware ranking only, NOT road-network
        routing (no Ghana road-network dataset or pgrouting extension exists).
      security: []
      parameters:
        - { in: query, name: lng, required: true, schema: { type: number } }
        - { in: query, name: lat, required: true, schema: { type: number } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        '200':
          description: 'count + note + data: EvacuationSuggestion[]'
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/EvacuationSuggestion' } } } }] } } }
        '400': { $ref: '#/components/responses/BadRequest' }

